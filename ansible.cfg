[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
# Run notified handlers even when a later task fails, so a changed config is
# never left un-applied (the next run would see no change and not restart).
force_handlers = True

[connection]
# One SSH round-trip per task instead of three. Needs !requiretty in sudoers
# (Debian's default).
pipelining = True

[ssh_connection]
# Trust on first use: unknown hosts are added to known_hosts, a CHANGED host
# key is refused (replaces the old host_key_checking = False).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = True
