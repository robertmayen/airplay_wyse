---
shairport_major: "4"
shairport_sync_version: "4.3.7"
shairport_sync_commit: "0b1c4391ffd398e7b145eb4b98416261380adeea"   # tag 4.3.7 — checkout truth (tags are mutable)
nqptp_version: "1.2.8"
nqptp_commit: "c925f27c1fd12e4033ac477e5a405969b0b0260b"            # tag 1.2.8
alac_ref: "5d8c5db0dfcadd5872f28e665cf4f4303447352a"                # was floating "master"

# The pairs above, as shipped. validate.yml refuses a run that overrides a
# version but not its commit: that would silently build the default commit.
_airplay_shipped_pins:
  shairport: {version: "4.3.7", commit: "0b1c4391ffd398e7b145eb4b98416261380adeea"}
  nqptp: {version: "1.2.8", commit: "c925f27c1fd12e4033ac477e5a405969b0b0260b"}

_shairport_flags:
  "4": >-
    --sysconfdir=/etc --with-alsa --with-soxr --with-avahi --with-ssl=openssl
    --with-systemd --with-airplay-2 --with-apple-alac
  "5": >-
    --sysconfdir=/etc --with-alsa --with-soxr --with-avahi --with-ssl=openssl
    --with-systemd-startup --with-airplay-2
shairport_configure_flags: >-
  {{ _shairport_flags[shairport_major] }}{{ ' --with-metadata --with-dbus-interface' if airplay_metadata_enabled | bool else '' }}

# Required runtime features (token-tolerant match against `shairport-sync -V`).
# ALAC is required only for the major-4 (apple-alac) profile.
airplay_required_features: "{{ ['AirPlay 2', 'soxr', 'ALAC'] if shairport_major == '4' else ['AirPlay 2', 'soxr'] }}"

# How binaries get onto the box. "source": clone+compile on the box (original
# path). "deb": install CI-built debs — downloaded on the CONTROL MACHINE via
# `gh release download` (works for private repos; boxes never need tokens).
airplay_install_method: source
airplay_deb_revision: 1
airplay_deb_repo: robertmayen/airplay_wyse
airplay_deb_release_tag: "debs-shairport{{ shairport_sync_version }}-nqptp{{ nqptp_version }}-r{{ airplay_deb_revision }}"
# Pre-downloaded deb dir on the control machine (skips the gh download).
# CI's smoke job uses this; operators can too for air-gapped runs.
airplay_deb_dir: ""

# --- shairport-sync.conf ------------------------------------------------------
# Required per host (no defaults): airplay_name, airplay_alsa_card.
# Pin the AirPlay 2 device-id instead of deriving it from the NIC MAC. Any
# spelling works: "5C:AA:FD:11:22:33" or "0x5CAAFD112233L". Empty = from MAC.
airplay_device_id: ""
airplay_alsa_device: 0
airplay_session_timeout: 60
# 5.x only: "auto" lets shairport pick the DAC's best format.
airplay_output_format: "auto"
# Force the output rate (e.g. 48000) when a DAC can't do 44.1 kHz; 0 = native.
airplay_output_rate: 0

# Tools the doctor, discover.yml and the dashboard rely on (both install methods).
airplay_runtime_packages:
  - alsa-utils
  - avahi-daemon
  - avahi-utils
  - dbus
  - iproute2
  - python3

airplay_build_root: /usr/local/src/airplay
airplay_state_dir: shairport-sync
# Periodic airplay-doctor run: publishes JSON to /run/airplay-doctor.json
# (tmpfs only — never /etc) for the dashboard's health badge.
airplay_health_timer: true
airplay_health_interval_minutes: 30

# Now-playing metadata + D-Bus control + web dashboard (opt-in feature).
# When true: build shairport with --with-metadata --with-dbus-interface,
# emit the metadata pipe, and install the nowplaying reader + dashboard.
airplay_metadata_enabled: false
# Pipe must live outside /tmp because the hardened unit sets PrivateTmp=yes.
airplay_metadata_pipe: /run/shairport-sync/metadata-pipe
airplay_dashboard_port: 8080
# Address the dashboard binds to. It is an UNAUTHENTICATED control surface
# (volume + disconnect over D-Bus). Default is loopback-only: set this to a
# LAN IP or "0.0.0.0" per-host/group to allow phones on the LAN to reach it.
airplay_dashboard_bind: "127.0.0.1"

# Dedicated system user shairport-sync runs as.
airplay_service_user: shairport-sync

# Final gate: after handlers ran, services must stay active (no restarts) for
# this long, or the play fails instead of reporting a crash-looping box as ok.
airplay_gate_settle_seconds: 8

# "always" keeps the DAC open (no standby clicks, device claimed at startup —
# requires the card to exist). "never"/"auto" open it only during playback;
# CI uses "never" because runners have no sound hardware.
airplay_alsa_disable_standby: "always"

# ALSA device addressing. "hw" = raw device (exclusive, soxr does any resampling);
# "plughw" = ALSA plug layer (automatic format/rate conversion, most tolerant).
# Set to "plughw" per-host if a DAC rejects the raw format.
airplay_alsa_prefix: "hw"

airplay_build_deps:
  - build-essential
  - git
  - autoconf
  - automake
  - libtool
  - libpopt-dev
  - libconfig-dev
  - libasound2-dev
  - avahi-daemon
  - libavahi-client-dev
  - libssl-dev
  - libsoxr-dev
  - libplist-dev
  - libplist-utils
  - libglib2.0-dev
  - libsodium-dev
  - libavutil-dev
  - libavcodec-dev
  - libavformat-dev
  - uuid-dev
  - libgcrypt20-dev
  - xxd
  - systemd-dev
