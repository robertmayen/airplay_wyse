---
# Before the build: shairport-sync's own `make install` hook would otherwise
# create this user with different settings.
- name: Ensure service group
  ansible.builtin.group:
    name: "{{ airplay_service_user }}"
    system: true

- name: Ensure service user
  ansible.builtin.user:
    name: "{{ airplay_service_user }}"
    group: "{{ airplay_service_user }}"
    groups: audio
    append: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin
