---
# Build-once artifact pipeline: compile shairport-sync/nqptp/libalac into
# amd64 .debs for Debian 13, smoke-test them via a full role converge in the
# CI systemd container, then publish as GitHub Release assets. The Ansible
# role consumes them with `-e airplay_install_method=deb` (control machine
# downloads via `gh release download` and pushes to the boxes).
name: debs
on:
  push:
    branches: [main]
    paths:
      - 'roles/airplay/defaults/main.yml'
      - 'ci/build-debs.sh'
      - 'ci/control/**'
      - '.github/workflows/debs.yml'
  workflow_dispatch:
# Least privilege: only the release job may write. Build steps run upstream
# configure/make as root, so no job that builds holds a write token.
permissions:
  contents: read
jobs:
  build-debs:
    runs-on: ubuntu-24.04   # amd64, matches the Wyse 5070 fleet
    container: debian:13    # dpkg-shlibdeps must see trixie package names
    steps:
      - name: Install build + packaging deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git autoconf automake \
            libtool libpopt-dev libconfig-dev libasound2-dev libavahi-client-dev libssl-dev \
            libsoxr-dev libplist-dev libglib2.0-dev libsodium-dev libavutil-dev libavcodec-dev \
            libavformat-dev uuid-dev libgcrypt20-dev xxd systemd-dev ca-certificates dpkg-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read pins from role defaults
        id: pins
        run: |
          for k in shairport_sync_version shairport_sync_commit nqptp_version nqptp_commit alac_ref; do
            echo "$k=$(grep -oP "^$k: \"\K[^\"]+" roles/airplay/defaults/main.yml)" >> "$GITHUB_OUTPUT"
          done
      - name: Build debs
        run: |
          ci/build-debs.sh \
            "${{ steps.pins.outputs.shairport_sync_version }}" "${{ steps.pins.outputs.shairport_sync_commit }}" \
            "${{ steps.pins.outputs.nqptp_version }}" "${{ steps.pins.outputs.nqptp_commit }}" \
            "${{ steps.pins.outputs.alac_ref }}" out/
      - name: SHA256SUMS
        run: cd out && sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debs-amd64
          path: out/

  smoke-debs:
    needs: build-debs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: debs-amd64
          path: out
      - name: Install ansible + docker connection plugin
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r collections/requirements.yml
      - name: Start systemd container
        run: ci/converge.sh up
      - name: Converge with the deb install path
        run: ci/converge.sh play -e airplay_install_method=deb -e airplay_deb_dir="$PWD/out"
      - name: Idempotence
        run: ci/converge.sh idempotent -e airplay_install_method=deb -e airplay_deb_dir="$PWD/out"
      - name: Verify services actually running
        run: |
          ci/converge.sh exec systemctl is-active nqptp shairport-sync
          ci/converge.sh exec shairport-sync -V
          ci/converge.sh exec nqptp -V
      - name: Dump logs on failure
        if: failure()
        run: ci/converge.sh logs

  release:
    needs: [build-debs, smoke-debs]
    # Only main publishes. A manual run from a feature branch must never
    # replace the release the fleet installs from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: debs-amd64
          path: out
      - name: Create/replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPS=$(grep -oP '^shairport_sync_version: "\K[^"]+' roles/airplay/defaults/main.yml)
          NQPTP=$(grep -oP '^nqptp_version: "\K[^"]+' roles/airplay/defaults/main.yml)
          TAG="debs-shairport${SPS}-nqptp${NQPTP}-r1"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --cleanup-tag -y
          gh release create "$TAG" out/*.deb out/SHA256SUMS \
            --title "$TAG" --notes "amd64 debs for Debian 13 (trixie). Prefix: /usr/local."
