---
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r collections/requirements.yml
      - name: Lint, test, syntax-check
        run: make check

  converge:
    needs: lint-test
    runs-on: ubuntu-24.04  # pinned: systemd-in-docker/cgroup behavior
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ["2.20.10", "2.21.5"]
    name: converge (ansible-core ${{ matrix.ansible-core }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ansible + docker connection plugin
        run: |
          pip install -r requirements-dev.txt
          pip install "ansible-core==${{ matrix.ansible-core }}"
          ansible-galaxy collection install -r collections/requirements.yml
      - name: Start systemd container
        run: ci/converge.sh up
      - name: "Converge (run 1: build from source)"
        run: ci/converge.sh play
      - name: "Idempotence (run 2: must report changed=0)"
        run: ci/converge.sh idempotent --diff
      - name: Verify services actually running
        run: |
          ci/converge.sh exec systemctl is-active nqptp shairport-sync
          ci/converge.sh exec shairport-sync -V
      - name: Dump logs on failure
        if: failure()
        run: ci/converge.sh logs
